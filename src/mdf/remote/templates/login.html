{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <h1 style="font-size: 1.5rem; margin-bottom: 2rem;">☠ LOGIN</h1>
    {% if request.query_params.get('error') %}
    <div style="color: var(--accent); margin-bottom: 1rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Wrong password.</div>
    {% endif %}
    <form method="post" action="/login" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="password" name="password" placeholder="Password" autofocus style="width: 100%;">
        <button type="submit" class="clear-btn" style="width: 100%; text-align: center;">Enter</button>
    </form>
</div>
{% endblock %}
