{% extends "base.html" %}

{% block content %}
    <div class="header-row">
        <h1>☠ MDF 2026</h1>
        <div class="theme-toggle-wrapper">
            <select id="theme-toggle" class="theme-toggle" onchange="applyTheme(this.value)">
                <option value="death">☠ Death</option>
                <option value="black">❄ Black</option>
            </select>
        </div>
    </div>

    <div class="controls">
        <form class="filters" id="filter-form" hx-get="/bands" hx-trigger="keyup delay:300ms, change" hx-target="#table-container" hx-swap="outerHTML">
            <input type="text" name="q" placeholder="Search..." value="{{ request.query_params.get('q', '') }}">
            <select name="day">
                <option value="">All Days</option>
                <option value="Wednesday" {% if request.query_params.get('day') == 'Wednesday' %}selected{% endif %}>Wednesday (Pre-Fest)</option>
                <option value="Thursday" {% if request.query_params.get('day') == 'Thursday' %}selected{% endif %}>Thursday</option>
                <option value="Friday" {% if request.query_params.get('day') == 'Friday' %}selected{% endif %}>Friday</option>
                <option value="Saturday" {% if request.query_params.get('day') == 'Saturday' %}selected{% endif %}>Saturday</option>
                <option value="Sunday" {% if request.query_params.get('day') == 'Sunday' %}selected{% endif %}>Sunday</option>
            </select>
            <select name="stage">
                <option value="">All Stages</option>
                <option value="Power Plant Live" {% if request.query_params.get('stage') == 'Power Plant Live' %}selected{% endif %}>Power Plant Live</option>
                <option value="Market Place" {% if request.query_params.get('stage') == 'Market Place' %}selected{% endif %}>Market Place</option>
                <option value="Nevermore Hall" {% if request.query_params.get('stage') == 'Nevermore Hall' %}selected{% endif %}>Nevermore Hall</option>
                <option value="Soundstage" {% if request.query_params.get('stage') == 'Soundstage' %}selected{% endif %}>Soundstage</option>
                <option value="Angels Rock Bar" {% if request.query_params.get('stage') == 'Angels Rock Bar' %}selected{% endif %}>Angels Rock Bar</option>
            </select>
            <select name="genre">
                <option value="">All Genres</option>
                <option value="death" {% if request.query_params.get('genre') == 'death' %}selected{% endif %}>Death</option>
                <option value="black" {% if request.query_params.get('genre') == 'black' %}selected{% endif %}>Black</option>
                <option value="doom" {% if request.query_params.get('genre') == 'doom' %}selected{% endif %}>Doom</option>
                <option value="thrash" {% if request.query_params.get('genre') == 'thrash' %}selected{% endif %}>Thrash</option>
            </select>
        </form>
        <a href="/" class="clear-btn" onclick="setTimeout(() => window.location.reload(), 0)">Reset</a>
    </div>

    <div class="key">
        <span><span class="symbol">⛧⛧</span> Must See</span>
        <span><span class="symbol">⛧</span> Recommended</span>
        <span><span class="symbol">✧</span> Worth Seeing</span>
        <span><span class="symbol">·</span> Skip</span>
    </div>

    <div id="loading" class="loading">Loading...</div>

    {% include "_table.html" %}
{% endblock %}
