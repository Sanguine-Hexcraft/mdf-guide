    <style>
        :root, .theme-death {
            --bg: #000000;
            --bg-secondary: #0d0d0d;
            --text: #b8b8b8;
            --text-bright: #e8e8e8;
            --accent: #ff0000;
            --border: #333;
            --rating-glow: none;
        }

        .theme-black {
            --bg: #050810;
            --bg-secondary: #0a0f18;
            --text: #6080a0;
            --text-bright: #c0d8f0;
            --accent: #40d0ff;
            --border: #1a2a40;
            --rating-gold: #ffd700;
        }

        :root {
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 5rem 2rem 2rem;
            min-height: 100vh;
            border: 8px solid var(--border);
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--accent);
            font-weight: 400;
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
            font-size: 3.5rem;
            border-bottom: 4px solid var(--accent);
            padding-bottom: 0.25rem;
            line-height: 1;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .clear-btn {
            background: var(--accent);
            color: var(--bg);
            border: 2px solid var(--accent);
            padding: 0.5rem 1.5rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.1s;
            text-decoration: none;
            display: inline-block;
        }

        .clear-btn:hover {
            background: var(--bg);
            color: var(--accent);
        }

        input, select {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-bright);
            padding: 0.75rem 1rem;
            font-family: 'Barlow', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filters:has(input:not(:placeholder-shown)) input,
        .filters:has(select:not([value=""])) select {
            border-color: var(--accent);
        }

        input::placeholder {
            color: var(--text);
            text-transform: uppercase;
        }

        .key {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            padding: 0.75rem 1rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .key span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .key .symbol {
            color: var(--accent);
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--border);
        }

        th {
            text-align: left;
            background: var(--bg-secondary);
            border-bottom: 4px solid var(--accent);
            padding: 0.75rem 0.75rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.8rem;
        }

        th a {
            color: var(--text-bright);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.1s;
        }

        th a:hover {
            color: var(--accent);
        }

        td {
            padding: 0.65rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:hover td {
            background: var(--bg-secondary);
            color: var(--text-bright);
        }

        tr.must-see td {
            background: rgba(255, 0, 0, 0.15);
            border-left: 3px solid var(--accent);
        }

        .theme-black tr.must-see td {
            background: rgba(64, 208, 255, 0.1);
        }

        tr.must-see td:first-child {
            color: var(--accent);
        }

        tr.must-see:hover td {
            background: rgba(255, 0, 0, 0.25);
        }

        .theme-black tr.must-see:hover td {
            background: rgba(64, 208, 255, 0.2);
        }

        td.band-name {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.95rem;
            color: var(--text-bright);
        }

        tr.must-see td.band-name {
            color: var(--accent);
        }

        td.band-name a {
            color: inherit;
            text-decoration: none;
        }

        td.band-name a:hover {
            color: var(--accent);
        }

        td.secondary {
            font-size: 0.8rem;
            color: var(--text);
        }

        .rating {
            color: var(--accent);
            letter-spacing: 0.3em;
            font-size: 1rem;
        }

        td.link {
            text-align: center;
        }

        td.link a {
            color: var(--accent);
            display: inline-block;
        }

        td.link a:hover {
            transform: scale(1.2);
        }

        td.notes {
            color: var(--text);
            font-style: italic;
            max-width: 200px;
            font-size: 0.8rem;
        }

        .empty {
            color: var(--text);
            text-align: center;
            padding: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-family: 'Barlow Condensed', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-bright);
            padding: 0.5rem 1rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .header-row h1 {
            margin-bottom: 0;
            flex: 1;
        }

        .theme-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Top nav bar */
        .site-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: stretch;
            height: 2.75rem;
        }

        .site-nav a {
            display: flex;
            align-items: center;
            padding: 0 1.25rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            color: var(--text);
            border-right: 1px solid var(--border);
            transition: all 0.15s;
        }

        .site-nav a:hover {
            color: var(--accent);
            background: var(--bg-secondary);
        }

        .site-nav a.nav-accent {
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }

        .site-nav a.nav-accent:hover {
            background: rgba(255, 0, 0, 0.1);
        }

        .theme-black .site-nav a.nav-accent:hover {
            background: rgba(64, 208, 255, 0.1);
        }

        .site-nav .nav-spacer {
            flex: 1;
        }

        @media (max-width: 768px) {
            body {
                padding: 4rem 1rem 1rem;
                border-width: 4px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .header-row {
                flex-direction: column;
            }

            .header-row h1 {
                width: 100%;
            }

            .theme-toggle-wrapper {
                width: 100%;
            }

            .theme-toggle {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            .filters {
                width: 100%;
            }

            .filters input,
            .filters select {
                width: 100%;
            }

            .clear-btn {
                width: 100%;
                text-align: center;
            }

            .key {
                flex-direction: column;
                gap: 0.5rem;
            }

            table {
                display: none;
            }

            .cards {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .card {
                display: flex;
                flex-direction: column;
                background: var(--bg-secondary);
                border: 2px solid var(--border);
                padding: 1rem;
            }

            .card.must-see {
                border-left: 3px solid var(--accent);
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }

            .card-band {
                font-size: 1rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--text-bright);
            }

            .card.must-see .card-band {
                color: var(--accent);
            }

            .card-rating {
                font-size: 1.2rem;
                color: var(--accent);
                letter-spacing: 0.2em;
            }

            .card-meta {
                font-size: 0.8rem;
                color: var(--text);
                margin-bottom: 0.5rem;
            }

            .card-genre {
                font-size: 0.8rem;
                color: var(--text);
                font-style: italic;
                margin-bottom: 0.5rem;
            }

            .card-notes {
                font-size: 0.8rem;
                color: var(--text);
                font-style: italic;
                border-top: 1px solid var(--border);
                padding-top: 0.5rem;
                margin-top: 0.5rem;
            }

            .card-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 0.5rem;
            }

            .card-link a {
                color: var(--accent);
            }
        }

        @media (min-width: 769px) {
            .cards {
                display: none;
            }

            .card {
                display: none;
            }
        }
    </style>
    <script>
        function getSavedTheme() {
            return localStorage.getItem('mdf-theme') || 'death';
        }

        function applyTheme(theme) {
            document.body.classList.remove('theme-death', 'theme-black');
            document.body.classList.add('theme-' + theme);
            localStorage.setItem('mdf-theme', theme);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const saved = getSavedTheme();
            applyTheme(saved);

            const toggle = document.getElementById('theme-toggle');
            if (toggle) {
                toggle.value = saved;
                toggle.addEventListener('change', function() {
                    applyTheme(this.value);
                });
            }

            initFilter();
        });

        // Client-side filtering — no network requests after initial load
        function fuzzyNorm(s) {
            return s.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function applyFilter() {
            const qInput = document.getElementById('q-input');
            const daySelect = document.getElementById('day-select');
            const stageSelect = document.getElementById('stage-select');
            const genreSelect = document.getElementById('genre-select');
            if (!qInput) return;

            const rawQ = qInput.value.trim().toLowerCase();
            const terms = rawQ ? rawQ.split(/\s+/).map(fuzzyNorm).filter(Boolean) : [];
            const day = daySelect ? daySelect.value : '';
            const stage = stageSelect ? stageSelect.value : '';
            const genre = genreSelect ? genreSelect.value.toLowerCase() : '';

            let visible = 0;
            document.querySelectorAll('.band-row').forEach(el => {
                const band = el.dataset.band || '';
                const elGenre = el.dataset.genre || '';
                const elLoc = el.dataset.location || '';
                const textOk = terms.every(t =>
                    fuzzyNorm(band).includes(t) || fuzzyNorm(elGenre).includes(t) || fuzzyNorm(elLoc).includes(t)
                );
                const dayOk = !day || (el.dataset.day || '').includes(day);
                const stageOk = !stage || el.dataset.stage === stage;
                const genreOk = !genre || (elGenre.toLowerCase()).includes(genre);
                const show = textOk && dayOk && stageOk && genreOk;
                el.style.display = show ? '' : 'none';
                if (show) visible++;
            });

            document.querySelectorAll('.card').forEach(el => {
                const band = el.dataset.band || '';
                const elGenre = el.dataset.genre || '';
                const elLoc = el.dataset.location || '';
                const textOk = terms.every(t =>
                    fuzzyNorm(band).includes(t) || fuzzyNorm(elGenre).includes(t) || fuzzyNorm(elLoc).includes(t)
                );
                const dayOk = !day || (el.dataset.day || '').includes(day);
                const stageOk = !stage || el.dataset.stage === stage;
                const genreOk = !genre || (elGenre.toLowerCase()).includes(genre);
                el.style.display = (textOk && dayOk && stageOk && genreOk) ? '' : 'none';
            });

            const noResultsRow = document.getElementById('no-results-row');
            const noResultsCard = document.getElementById('no-results-card');
            if (noResultsRow) noResultsRow.style.display = visible === 0 ? '' : 'none';
            if (noResultsCard) noResultsCard.style.display = visible === 0 ? '' : 'none';
        }

        function initFilter() {
            const qInput = document.getElementById('q-input');
            const daySelect = document.getElementById('day-select');
            const stageSelect = document.getElementById('stage-select');
            const genreSelect = document.getElementById('genre-select');
            if (!qInput) return;

            qInput.addEventListener('input', applyFilter);
            if (daySelect) daySelect.addEventListener('change', applyFilter);
            if (stageSelect) stageSelect.addEventListener('change', applyFilter);
            if (genreSelect) genreSelect.addEventListener('change', applyFilter);

            // Apply any pre-set values (e.g. from URL params used to populate the form)
            applyFilter();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</head>
<body>
    <nav class="site-nav">
        <a href="/">☠ MDF 2026</a>
        <a href="/schedule" class="nav-accent">My Schedule</a>
        <a href="/summary">Trip Summary</a>
        <div class="nav-spacer"></div>
        <span style="display:flex;align-items:center;padding:0 0.75rem;border-left:1px solid var(--border);">
            <select id="theme-toggle" class="theme-toggle" style="border:none;padding:0.25rem 0.5rem;background:transparent;font-size:0.8rem;" onchange="applyTheme(this.value)">
                <option value="death">☠ Death</option>
                <option value="black">❄ Black</option>
            </select>
        </span>
        {% if authed is defined and authed %}
        <a href="/logout">Logout</a>
        {% else %}
        <a href="/login">Login</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
