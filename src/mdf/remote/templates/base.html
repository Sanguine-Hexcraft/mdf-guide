<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDF 2026</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root, .theme-death {
            --bg: #000000;
            --bg-secondary: #0d0d0d;
            --text: #b8b8b8;
            --text-bright: #e8e8e8;
            --accent: #ff0000;
            --border: #333;
            --rating-glow: none;
        }

        .theme-black {
            --bg: #050810;
            --bg-secondary: #0a0f18;
            --text: #6080a0;
            --text-bright: #c0d8f0;
            --accent: #40d0ff;
            --border: #1a2a40;
            --rating-gold: #ffd700;
        }

        :root {
            color-scheme: dark;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            border: 8px solid var(--border);
        }

        h1 {
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 1.5rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 2.5rem;
            border-bottom: 4px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .clear-btn {
            background: var(--accent);
            color: var(--bg);
            border: 2px solid var(--accent);
            padding: 0.5rem 1.5rem;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.1s;
        }

        .clear-btn:hover {
            background: var(--bg);
            color: var(--accent);
        }

        input, select {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-bright);
            padding: 0.75rem 1rem;
            font-family: inherit;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .filters:has(input:not(:placeholder-shown)) input,
        .filters:has(select:not([value=""])) select {
            border-color: var(--accent);
        }

        input::placeholder {
            color: var(--text);
            text-transform: uppercase;
        }

        .key {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .key span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .key .symbol {
            color: var(--accent);
            font-size: 1.1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--border);
        }

        th {
            text-align: left;
            background: var(--bg-secondary);
            border-bottom: 4px solid var(--accent);
            padding: 1rem 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.75rem;
        }

        th a {
            color: var(--text-bright);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.1s;
        }

        th a:hover {
            color: var(--accent);
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        tr:hover td {
            background: var(--bg-secondary);
            color: var(--text-bright);
        }

        tr.must-see td {
            background: rgba(255, 0, 0, 0.15);
            border-left: 3px solid var(--accent);
        }

        .theme-black tr.must-see td {
            background: rgba(64, 208, 255, 0.1);
        }

        tr.must-see td:first-child {
            color: var(--accent);
        }

        tr.must-see:hover td {
            background: rgba(255, 0, 0, 0.25);
        }

        .theme-black tr.must-see:hover td {
            background: rgba(64, 208, 255, 0.2);
        }

        tr td:first-child {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .rating {
            color: var(--accent);
            letter-spacing: 0.3em;
            font-size: 1rem;
        }

        td.link {
            text-align: center;
        }

        td.link a {
            color: var(--accent);
            display: inline-block;
        }

        td.link a:hover {
            transform: scale(1.2);
        }

        td.notes {
            color: var(--text);
            font-style: italic;
            max-width: 200px;
        }

        .empty {
            color: var(--text);
            text-align: center;
            padding: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            animation: blink 0.5s infinite;
        }

        #loading.htmx-request {
            display: block;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            color: var(--text-bright);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .header-row h1 {
            margin-bottom: 0;
            flex: 1;
        }

        .theme-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
                border-width: 4px;
            }

            h1 {
                font-size: 1.5rem;
                letter-spacing: 0.2em;
            }

            .header-row {
                flex-direction: column;
            }

            .header-row h1 {
                width: 100%;
            }

            .theme-toggle-wrapper {
                width: 100%;
            }

            .theme-toggle {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            .filters {
                width: 100%;
            }

            .filters input,
            .filters select {
                width: 100%;
            }

            .clear-btn {
                width: 100%;
                text-align: center;
            }

            .key {
                flex-direction: column;
                gap: 0.5rem;
            }

            table {
                display: none;
            }

            .cards {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .card {
                display: flex;
                flex-direction: column;
                background: var(--bg-secondary);
                border: 2px solid var(--border);
                padding: 1rem;
            }

            .card.must-see {
                border-left: 3px solid var(--accent);
            }

            .card-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }

            .card-band {
                font-size: 1.1rem;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-bright);
            }

            .card.must-see .card-band {
                color: var(--accent);
            }

            .card-rating {
                font-size: 1.2rem;
                color: var(--accent);
                letter-spacing: 0.2em;
            }

            .card-meta {
                font-size: 0.8rem;
                color: var(--text);
                margin-bottom: 0.5rem;
            }

            .card-genre {
                font-size: 0.75rem;
                color: var(--text);
                font-style: italic;
                margin-bottom: 0.5rem;
            }

            .card-notes {
                font-size: 0.8rem;
                color: var(--text);
                font-style: italic;
                border-top: 1px solid var(--border);
                padding-top: 0.5rem;
                margin-top: 0.5rem;
            }

            .card-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 0.5rem;
            }

            .card-link a {
                color: var(--accent);
            }
        }

        @media (min-width: 769px) {
            .cards {
                display: none;
            }

            .card {
                display: none;
            }
        }
    </style>
    <script>
        function getSavedTheme() {
            return localStorage.getItem('mdf-theme') || 'death';
        }

        function applyTheme(theme) {
            document.body.classList.remove('theme-death', 'theme-black');
            document.body.classList.add('theme-' + theme);
            localStorage.setItem('mdf-theme', theme);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const saved = getSavedTheme();
            applyTheme(saved);

            const toggle = document.getElementById('theme-toggle');
            if (toggle) {
                toggle.value = saved;
                toggle.addEventListener('change', function() {
                    applyTheme(this.value);
                });
            }
        });

        document.body.addEventListener('htmx:afterSwap', () => {
            const toggle = document.getElementById('theme-toggle');
            if (toggle) {
                toggle.value = getSavedTheme();
                toggle.addEventListener('change', function() {
                    applyTheme(this.value);
                });
            }
        });
    </script>
</head>
<body>
    <div style="position: fixed; top: 0.75rem; right: 1rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; z-index: 100;">
        {% if authed is defined and authed %}
        <a href="/logout" style="color: var(--text); text-decoration: none;">Logout</a>
        {% else %}
        <a href="/login" style="color: var(--text); text-decoration: none;">Login</a>
        {% endif %}
    </div>
    {% block content %}{% endblock %}
</body>
</html>
