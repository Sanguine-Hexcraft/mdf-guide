<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDF 2026</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #111;
            --text: #e0e0e0;
            --text-dim: #666;
            --accent: #a8d8ea;
            --border: #333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            font-weight: normal;
            margin-bottom: 2rem;
            letter-spacing: 0.2em;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input, select {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        input::placeholder {
            color: var(--text-dim);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 0.5rem;
            font-weight: normal;
            letter-spacing: 0.1em;
        }

        td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover td {
            background: var(--bg-secondary);
        }

        .rating {
            color: var(--accent);
            letter-spacing: 0.2em;
        }

        .empty {
            color: var(--text-dim);
            text-align: center;
            padding: 3rem;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
